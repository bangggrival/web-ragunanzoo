services:
  postgres:
    image: postgres:14-alpine
    container_name: ragunan-db
    restart: unless-stopped
    networks:
      - ragunan-internal
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
      POSTGRES_DB: ${PGDATABASE:-ragunan_zoo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/init_database.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-ragunan_zoo}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  ragunan-api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ragunan-api
    restart: unless-stopped
    networks:
      - ragunan-internal
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./server/.env
    environment:
      - PGHOST=postgres
      - PGPORT=5432
    ports:
      - "5005:5005"
    volumes:
      - ./server/uploads:/app/uploads

  ragunan-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:5005}
    container_name: ragunan-web
    restart: unless-stopped
    networks:
      - ragunan-internal
    depends_on:
      ragunan-api:
        condition: service_started
    ports:
      - "${WEB_PORT:-3002}:3002"
    environment:
      - PORT=3002
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://10.41.20.245:5005}
      - INTERNAL_BACKEND_URL=http://ragunan-api:5005

networks:
  ragunan-internal:
    driver: bridge

volumes:
  postgres_data:

