# ==============================================================================
# Nginx Reverse Proxy Configuration - Taman Margasatwa Ragunan Web Application
# ==============================================================================
# Lokasi file di server: /etc/nginx/sites-available/ragunan.conf
# Aktifkan: ln -s /etc/nginx/sites-available/ragunan.conf /etc/nginx/sites-enabled/
# Test: sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

# Upstream Server Definitions
upstream ragunan_web {
    server 127.0.0.1:3002;
    keepalive 32;
}

upstream ragunan_api {
    server 127.0.0.1:5005;
    keepalive 32;
}

# 1. HTTP Redirect to HTTPS (Production Standard)
server {
    listen 80;
    listen [::]:80;
    server_name ragunanzoo.jakarta.go.id www.ragunanzoo.jakarta.go.id; # Ganti dengan domain Anda

    # ACME Challenge for Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Main HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ragunanzoo.jakarta.go.id www.ragunanzoo.jakarta.go.id; # Ganti dengan domain Anda

    # SSL Certificates (Otomatis diisi oleh certbot --nginx)
    # ssl_certificate /etc/letsencrypt/live/ragunanzoo.jakarta.go.id/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ragunanzoo.jakarta.go.id/privkey.pem;

    # SSL Hardening (Mozilla Intermediate Guideline)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Max Upload Size (Menyesuaikan upload gambar satwa, banner, dan bukti aduan)
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Common Proxy Headers
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # Static Assets Caching for Next.js
    location /_next/static/ {
        proxy_pass http://ragunan_web;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Public Uploaded Media (Bypass Next.js server, serve directly from API)
    location /uploads/ {
        proxy_pass http://ragunan_api;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Realtime Server-Sent Events (SSE) Endpoint
    location /api/realtime/ {
        proxy_pass http://ragunan_api;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 24h;
        chunked_transfer_encoding on;
    }

    # Backend API Routing
    location /api/ {
        proxy_pass http://ragunan_api;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Frontend Next.js Root Routing
    location / {
        proxy_pass http://ragunan_web;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
